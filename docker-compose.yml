name: teamhub
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teamhub
      POSTGRES_PASSWORD: teamhub
      POSTGRES_DB: teamhub
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # api 服务 gate 在这个健康检查上，避免应用先于数据库起来
      test: ["CMD-SHELL", "pg_isready -U teamhub -d teamhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://teamhub:teamhub@postgres:5432/teamhub
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      USE_FAKEREDIS: "false"
      CELERY_ALWAYS_EAGER: "false"
      # ★ 必须是 prod（不是 local）：local 会触发 _bootstrap_local_schema 里
      #   「SQLite 内存库」分支的判定条件之一，虽然这里的 DATABASE_URL 是
      #   PostgreSQL、不会被 create_all 误伤，但 local 还意味着 debug=True、
      #   JSON 日志关闭、生产密钥守卫（_guard_production_secrets）不生效——
      #   后者最危险：APP_ENV=local 时可以用默认占位 JWT_SECRET 起线上服务，
      #   等于签名形同虚设。compose 是「别人 clone 下来一键起」的部署形态，
      #   必须按生产对待。
      APP_ENV: prod
      # ★ 生产密钥必须覆盖：openssl rand -hex 32 生成，或放 .env 里
      #   JWT_SECRET=... （APP_ENV=prod 下用占位值会拒绝启动，这是有意的）。
      #   用 ${JWT_SECRET:?err} 形式：未设置时 compose 直接报错并拒绝启动，
      #   而不是带着占位密钥悄悄上线。
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env, see README}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # 先跑迁移再起服务，避免表不存在
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://teamhub:teamhub@postgres:5432/teamhub
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      USE_FAKEREDIS: "false"
      CELERY_ALWAYS_EAGER: "false"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # ★ Celery worker 天然没有请求上下文，
    #   必须在任务入口显式 set_context(tenant_id)，出口 reset（PROJECT-PLAN 九·风险 2）
    command: celery -A app.tasks.celery_app worker -l info

  beat:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://teamhub:teamhub@postgres:5432/teamhub
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_ALWAYS_EAGER: "false"
    depends_on:
      redis: {condition: service_healthy}
    command: celery -A app.tasks.celery_app beat -l info

volumes:
  pgdata:
