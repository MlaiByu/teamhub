name: teamhub
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teamhub
      POSTGRES_PASSWORD: teamhub
      POSTGRES_DB: teamhub
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # api 服务 gate 在这个健康检查上，避免应用先于数据库起来
      test: ["CMD-SHELL", "pg_isready -U teamhub -d teamhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://teamhub:teamhub@postgres:5432/teamhub
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      USE_FAKEREDIS: "false"
      CELERY_ALWAYS_EAGER: "false"
      APP_ENV: local
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # 先跑迁移再起服务，避免表不存在
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://teamhub:teamhub@postgres:5432/teamhub
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      USE_FAKEREDIS: "false"
      CELERY_ALWAYS_EAGER: "false"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # ★ Celery worker 天然没有请求上下文，
    #   必须在任务入口显式 set_context(tenant_id)，出口 reset（PROJECT-PLAN 九·风险 2）
    command: celery -A app.tasks.celery_app worker -l info

  beat:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://teamhub:teamhub@postgres:5432/teamhub
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_ALWAYS_EAGER: "false"
    depends_on:
      redis: {condition: service_healthy}
    command: celery -A app.tasks.celery_app beat -l info

volumes:
  pgdata:
