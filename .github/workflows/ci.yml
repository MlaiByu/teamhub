name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: lint + type + test
    runs-on: ubuntu-latest

    # 全部依赖用降级模式（SQLite + fakeredis），不装 Postgres/Redis
    # —— 这正是 PROJECT-PLAN 11.2 想验证的事：别人 clone 下来就能跑
    env:
      APP_ENV: test
      # ★ 必须加引号：不加引号时 YAML 会把值末尾的冒号当成嵌套 mapping 的键，
      #   整个工作流在加载阶段就被拒（症状是 run 同一秒内 failed 且 0 个 job，
      #   而不是某个步骤失败——很容易误判成代码问题）。
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      USE_FAKEREDIS: "true"
      CELERY_ALWAYS_EAGER: "true"
      JWT_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check app tests

      - name: Format check (ruff format)
        run: ruff format --check app tests

      - name: Type check (mypy)
        run: mypy app
        # 阶段 4 承诺：mypy 转硬失败。此前 4 个遗留错误已清零，
        # 现在 mypy 全绿，失败即阻断——不再用 continue-on-error 掩盖类型错误。

      # ★ 安全测试单独跑一步，且失败即阻断
      # 隔离与越权测试是项目第一优先，不该和业务测试混在一起被忽略
      - name: Security tests (tenant isolation)
        run: pytest tests/security -v

      - name: All tests + coverage
        # ★ --cov-fail-under：覆盖率**跌破门槛即阻断**。
        #   只报告不阻断的覆盖率等于没有约束——它会一路缓慢下滑，
        #   而每次下滑单独看都「只降了一点点」。
        #   门槛取 90（当前 ~95），留出正常波动余量，避免变成噪音。
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml \
                 --cov-fail-under=90

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
