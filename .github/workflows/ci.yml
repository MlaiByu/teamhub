name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: lint + type + test
    runs-on: ubuntu-latest

    # 全部依赖用降级模式（SQLite + fakeredis），不装 Postgres/Redis
    # —— 这正是 PROJECT-PLAN 11.2 想验证的事：别人 clone 下来就能跑
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      USE_FAKEREDIS: "true"
      CELERY_ALWAYS_EAGER: "true"
      JWT_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check app tests

      - name: Format check (ruff format)
        run: ruff format --check app tests

      - name: Type check (mypy)
        run: mypy app
        continue-on-error: true   # 第 1 周先不阻断，阶段 4 转硬失败

      # ★ 安全测试单独跑一步，且失败即阻断
      # 隔离与越权测试是项目第一优先，不该和业务测试混在一起被忽略
      - name: Security tests (tenant isolation)
        run: pytest tests/security -v

      - name: All tests + coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
