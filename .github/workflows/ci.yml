name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: lint + type + test
    runs-on: ubuntu-latest

    # 全部依赖用降级模式（SQLite + fakeredis），不装 Postgres/Redis
    # —— 这正是 PROJECT-PLAN 11.2 想验证的事：别人 clone 下来就能跑
    env:
      APP_ENV: test
      # ★ 必须加引号：不加引号时 YAML 会把值末尾的冒号当成嵌套 mapping 的键，
      #   整个工作流在加载阶段就被拒（症状是 run 同一秒内 failed 且 0 个 job，
      #   而不是某个步骤失败——很容易误判成代码问题）。
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      USE_FAKEREDIS: "true"
      CELERY_ALWAYS_EAGER: "true"
      JWT_SECRET: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      # ★ 改用 uv + 锁文件安装（2026-10-10）。
      #   起因是一个真实事故：`pyproject` 写的是 `mypy>=1.13`（无上界），
      #   于是 CI 每次都装「当时最新」的 mypy。2026-10-10 mypy 发了 2.4.0，
      #   它的**新检查**让 CI 变红——而报错的两处代码**一行都没被改过**，
      #   只是过去就存在「不够精确的类型标注」，被新规则照出来了。
      #
      #   也就是说：那天「代码是好的、CI 是红的」，且两者毫无因果关系。
      #   这是比任何单次失败都更糟的信号——**它意味着 CI 的结果不可复现**。
      #
      #   根治不是给 mypy 加上界（那只是把风险推后，且加了界 lock 就失配），
      #   而是让 CI 与本地**装同一个版本**：uv.lock 已入库，`--frozen` 保证
      #   「锁文件与 pyproject 不一致时直接失败」，绝不在 CI 上悄悄升级依赖。
      #
      #   附带收益：不再需要 actions/setup-python——Python 版本由
      #   `.python-version`（3.12.10）经 uv 管理，与本地开发机一致。
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint (ruff check)
        run: uv run --frozen ruff check app tests

      - name: Format check (ruff format)
        run: uv run --frozen ruff format --check app tests

      - name: Type check (mypy)
        run: uv run --frozen mypy app
        # 阶段 4 承诺：mypy 转硬失败。此前 4 个遗留错误已清零，
        # 现在 mypy 全绿，失败即阻断——不再用 continue-on-error 掩盖类型错误。

      # ★ 安全测试单独跑一步，且失败即阻断
      # 隔离与越权测试是项目第一优先，不该和业务测试混在一起被忽略
      - name: Security tests (tenant isolation)
        run: uv run --frozen pytest tests/security -v

      - name: All tests + coverage
        # ★ --cov-fail-under：覆盖率**跌破门槛即阻断**。
        #   只报告不阻断的覆盖率等于没有约束——它会一路缓慢下滑，
        #   而每次下滑单独看都「只降了一点点」。
        #   门槛取 90（当前 ~95），留出正常波动余量，避免变成噪音。
        run: |
          uv run --frozen pytest --cov=app --cov-report=term-missing --cov-report=xml \
                 --cov-fail-under=90

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
