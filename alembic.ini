[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]
# No ruff format hook here on purpose.
# The console_scripts entrypoint lookup for ruff fails when alembic is invoked as
# `python -m alembic` inside a venv (ruff's script is not on PATH), so every
# autogenerate run would end with FAILED even though the file was written.
# Formatting is handled by: ruff format app tests alembic
#
# NOTE: keep this file ASCII-only. configparser reads it with the system locale
# codec (GBK on zh-CN Windows), so non-ASCII bytes here break alembic entirely.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
